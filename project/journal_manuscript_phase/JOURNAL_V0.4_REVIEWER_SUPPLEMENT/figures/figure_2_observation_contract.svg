   <g id="text_1">
    <text style="fill: #182838; font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="293.22" y="40.014873" transform="rotate(-0 293.22 40.014873)">Prospectively specified conditions and bound deployment</text>
   </g>
   <g id="text_2">
    <text style="fill: #182838; font: 9px 'DejaVu Sans'; text-anchor: middle" x="293.22" y="54.105277" transform="rotate(-0 293.22 54.105277)">Legal histories, source/configuration predicates and fixed comparison pairs</text>
   </g>
   <g id="text_3">
    <text style="fill: #182838; font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="126.7407" y="149.153519" transform="rotate(-0 126.7407 149.153519)">Reference Y</text>
   </g>
   <g id="text_4">
    <text style="fill: #182838; font: 9px 'DejaVu Sans'" transform="translate(87.709528 167.725403)">Input acceptance</text>
    <text style="fill: #182838; font: 9px 'DejaVu Sans'" transform="translate(95.436872 178.487294)">Return source</text>
    <text style="fill: #182838; font: 9px 'DejaVu Sans'" transform="translate(104.982497 189.249184)">Transition</text>
   </g>
   <g id="text_5">
    <text style="fill: #5a6670; font: 9px 'DejaVu Sans'" transform="translate(47.737575 221.430769)">Specified before observed outputs;</text>
    <text style="fill: #5a6670; font: 9px 'DejaVu Sans'" transform="translate(52.618669 231.5088)">not a complete second simulator</text>
   </g>
   <g id="text_6">
    <text style="fill: #182838; font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="402.7833" y="99.340424" transform="rotate(-0 402.7833 99.340424)">Designated deployed execution</text>
   </g>
   <g id="text_7">
    <text style="fill: #182838; font: 700 10px 'DejaVu Sans'; text-anchor: start" x="261.9162" y="153.50472" transform="rotate(-0 261.9162 153.50472)">O3  =  O2 + collected opcode trace</text>
   </g>
   <g id="text_8">
    <text style="fill: #182838; font: 700 10px 'DejaVu Sans'; text-anchor: start" x="276.1452" y="194.364" transform="rotate(-0 276.1452 194.364)">O2  =  O1 + actual public context</text>
   </g>
   <g id="text_9">
    <text style="fill: #182838; font: 9px 'DejaVu Sans'" transform="translate(276.1452 212.940529)">Pre/post getters, source/status/validity fields</text>
    <text style="fill: #182838; font: 9px 'DejaVu Sans'" transform="translate(276.1452 223.01856)">and declared public events</text>
   </g>
   <g id="text_10">
    <text style="fill: #182838; font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="402.7833" y="264.581721" transform="rotate(-0 402.7833 264.581721)">O1  =  complete primary return tuple</text>
   </g>
   <g id="text_11">
    <text style="fill: #182838; font: 9px 'DejaVu Sans'; text-anchor: middle" x="402.7833" y="280.58243" transform="rotate(-0 402.7833 280.58243)">Includes Boolean fields where the ABI returns them</text>
   </g>
   <g id="text_12">
    <text style="fill: #182838; font: 10px 'DejaVu Sans'" transform="translate(57.071169 271.728695)">Compare predeclared pairs:</text>
    <text style="fill: #182838; font: 10px 'DejaVu Sans'" transform="translate(60.82195 282.926508)">same or different Y versus</text>
    <text style="fill: #182838; font: 10px 'DejaVu Sans'" transform="translate(52.363356 294.12432)">same or different observation</text>
   </g>
   <g id="text_13">
    <text style="fill: #182838; font: 10px 'DejaVu Sans'" transform="translate(31.4064 351.379068)">Nested observation sets, not a ranking of scientific value. Public fields are never withheld from O2.</text>
    <text style="fill: #182838; font: 10px 'DejaVu Sans'" transform="translate(31.4064 362.57688)">Observed matrix: 11 predeclared O1 collisions separated by O2; no additional O3 separation.</text>
   </g>
